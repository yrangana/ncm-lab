[project]
name = "ncm-lab"
version = "0.1.0"
description = "Python checks for the ncm-lab ONNX models."
requires-python = ">=3.11"
dependencies = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "huggingface_hub>=0.24",
]

[tool.uv]
package = false

[dependency-groups]
quant = [
    "onnx-ir>=1.1.0",
]
